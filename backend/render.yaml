services:
  - type: web
    name: forecast-evidence-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: FRONTEND_ORIGIN
        value: https://forecast-evidence-diagnostic-system.vercel.app,http://localhost:5173
      - key: PYTHON_VERSION
        value: 3.11.9
